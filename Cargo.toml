[workspace]
members = [
    "anoxia-core",
    "anoxia-gui",
]
resolver = "2"

[workspace.package]
version = "2.1.0"
authors = ["Nabil Brag"]
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Misterbra/anoxia-simulator"

[workspace.dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"



# GUI
eframe = "0.28"
egui_plot = "0.28"
rfd = "0.14"


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
